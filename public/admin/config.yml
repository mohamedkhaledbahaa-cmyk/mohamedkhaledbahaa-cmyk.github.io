# لوحة التحكم لكتابة ونشر المقالات من المتصفح (Sveltia CMS)
backend:
  name: github
  repo: mohamedkhaledbahaa-cmyk/mohamedkhaledbahaa-cmyk.github.io
  branch: main

site_url: https://mohamedkhaledbahaa-cmyk.github.io
logo_url: /logo-96.png
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: articles
    label: المقالات
    label_singular: مقال
    folder: src/content/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "العنوان", name: title, widget: string }
      - { label: "رابط المقال بالإنجليزي (مثال: cable-sizing)", name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "حروف إنجليزي صغيرة وأرقام وشرطة (-) فقط"] }
      - { label: "وصف مختصر", name: description, widget: text }
      - { label: "تاريخ النشر", name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - label: "التصنيف"
        name: category
        widget: select
        options:
          - { label: "تحليل جداول الكميات", value: boq }
          - { label: "تقدير التكاليف", value: estimation }
          - { label: "العروض الفنية والتجارية", value: proposals }
          - { label: "مشاريع EPC", value: epc }
      - { label: "الوسوم", name: tags, widget: list, required: false }
      - { label: "صورة الغلاف", name: cover, widget: image, required: false }
      - { label: "مقال مميز في الرئيسية؟", name: featured, widget: boolean, default: false, required: false }
      - { label: "مسودة (مخفي)؟", name: draft, widget: boolean, default: false, required: false }
      - { label: "المحتوى", name: body, widget: markdown }
