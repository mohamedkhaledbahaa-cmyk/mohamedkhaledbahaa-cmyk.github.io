name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1-5'   # weekdays ~08:17 Cairo: refresh LME & USD prices
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch today's LME copper / aluminium and USD rate
        run: python3 tools/fetch_market.py
        continue-on-error: true
      - run: npm run build
      # Keep the hashed JS/CSS files of earlier deploys, so pages cached by browsers
      # (e.g. the LinkedIn / Facebook in-app browsers) still find the files they reference.
      - name: Restore assets of previous deploys
        uses: actions/cache/restore@v4
        with:
          path: .old-assets
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-
      - name: Merge previous assets into this deploy
        run: |
          mkdir -p .old-assets dist/_astro
          cp -n .old-assets/* dist/_astro/ 2>/dev/null || true
          cp dist/_astro/* .old-assets/
          ls .old-assets | wc -l
      - name: Save assets for future deploys
        uses: actions/cache/save@v4
        with:
          path: .old-assets
          key: astro-assets-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
